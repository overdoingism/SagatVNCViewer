[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sagatvnc-viewer"
dynamic = ["version"]
description = "A pure-Python VNC viewer ported from the TigerVNC viewer"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Smooth scaling of the remote desktop to the window (Lanczos/bicubic)
scaling = ["pillow>=9.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Topic :: System :: Networking",
]

[project.scripts]
sagatvncviewer = "sagatvnc.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "sagatvnc.__version__"}

[tool.setuptools.packages.find]
include = ["sagatvnc*"]
