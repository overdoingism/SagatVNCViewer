# Builds everything on GitHub's runners and, for a v* tag, publishes a
# GitHub release with build provenance attestations:
#   wheels with the Rust decoders for Windows x64/ARM64, Linux
#   x86_64/aarch64 (manylinux) and macOS (universal2), a pure-Python
#   wheel for everything else, the sdist, and the Windows exe.
# Run it by hand (workflow_dispatch) to build without publishing.
# PyPI upload is off until the repository variable PYPI_PUBLISH is
# "true" and PyPI trusted publishing is set up (see RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' sagatvnc/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

  wheels:
    name: Wheel ${{ matrix.name }}
    needs: [test, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x64, os: windows-latest, archs: AMD64}
          - {name: windows-arm64, os: windows-11-arm, archs: ARM64}
          - {name: linux-x86_64, os: ubuntu-latest, archs: x86_64}
          - {name: linux-aarch64, os: ubuntu-24.04-arm, archs: aarch64}
          - {name: macos-universal2, os: macos-latest, archs: universal2,
             targets: "aarch64-apple-darwin x86_64-apple-darwin"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux builds run in the manylinux container: Rust is installed
      # there (CIBW_BEFORE_ALL_LINUX), not on the runner
      - if: runner.os != 'Linux'
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.targets }}
      # Windows wheels need no repair step, so they are built directly
      # (cibuildwheel downloads virtualenv.pyz from GitHub there, which
      # kept failing with 504 on the ARM64 runner)
      - if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the wheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          SAGATVNC_BUILD_ACCEL: "1"
        run: |
          python -m pip install build
          python -m build --wheel --outdir wheelhouse
      - name: Test the wheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/Scripts/python"
          "$py" -m pip install wheelhouse/*.whl
          mkdir "$RUNNER_TEMP/t" && cp -r tests "$RUNNER_TEMP/t/" && cd "$RUNNER_TEMP/t"
          "$py" -c "import sys; from sagatvnc.rfb import accel; print(accel.status); sys.exit(accel.lib is None)"
          "$py" -m unittest tests.test_accel
      - if: runner.os != 'Windows'
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          # One build per platform: the wheel is py3-none-<platform>
          CIBW_BUILD: "cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_ENVIRONMENT: SAGATVNC_BUILD_ACCEL=1
          CIBW_ENVIRONMENT_LINUX: >-
            SAGATVNC_BUILD_ACCEL=1 PATH="$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_MACOS: >-
            SAGATVNC_BUILD_ACCEL=1 MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain stable
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import sys; from sagatvnc.rfb import accel;
            print(accel.status); sys.exit(accel.lib is None)"
            && python -m unittest tests.test_accel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source and pure-Python wheel
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-rust
      - run: python -m pip install build
      - name: Build the sdist
        run: python -m build --sdist
      - name: Build the pure-Python wheel
        env:
          SAGATVNC_BUILD_ACCEL: "0"
        run: python -m build --wheel
      - name: The sdist builds the native decoders too
        env:
          SAGATVNC_BUILD_ACCEL: "1"
        run: |
          python -m pip wheel --no-deps -w check dist/*.tar.gz
          ls check
          ls check/*-py3-none-linux_*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  exe:
    name: Windows exe ${{ matrix.name }}
    needs: [test, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: x64, os: windows-latest}
          - {name: arm64, os: windows-11-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-rust
      - run: python -m pip install pyinstaller pillow
      - name: Build SagatVNCViewer.exe
        run: python packaging/build_exe.py
      - name: Pack the exe with its licence texts
        shell: pwsh
        env:
          ZIPNAME: SagatVNCViewer-${{ needs.version.outputs.version }}-windows-${{ matrix.name }}.zip
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist\SagatVNCViewer.exe, dist\licenses -DestinationPath "out\$env:ZIPNAME"
          Get-ChildItem out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-${{ matrix.name }}
          path: out/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels, sdist, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sed -e "s|@TAG@|$TAG|g" -e "s|@SHA@|$GITHUB_SHA|g" \
              -e "s|@REPO@|$GITHUB_REPOSITORY|g" \
              -e "s|@RUN@|$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID|g" \
              .github/release-notes.md > notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "SagatVNC Viewer ${TAG#v}" --notes-file notes.md

  pypi:
    name: Upload to PyPI
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sagatvnc-viewer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
