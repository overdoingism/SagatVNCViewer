name: Set up Rust
description: >
  Use the runner's Rust if it has one, otherwise install the stable
  toolchain with rustup (minimal profile). Optionally add targets.
inputs:
  targets:
    description: Space-separated Rust targets to add (e.g. for universal2)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install rustup (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $exe = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
          Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile $exe
          & $exe -y --profile minimal --default-toolchain stable
          "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        }
    - name: Install rustup (Linux, macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if ! command -v cargo >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
    - name: Add targets
      if: inputs.targets != ''
      shell: bash
      run: rustup target add ${{ inputs.targets }}
    - name: Show the toolchain
      shell: bash
      run: |
        rustc --version
        cargo --version
